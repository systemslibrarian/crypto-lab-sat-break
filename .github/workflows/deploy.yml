name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The gate must judge pull requests too, or a Dependabot bump auto-merges
  # against no signal at all.
  pull_request:
    branches: [main]
  # So a deploy can be re-run by hand, and so the auto-merge job below can
  # dispatch one. A merge made with GITHUB_TOKEN raises no push event.
  workflow_dispatch:

# NOT a bare `pages`: with cancel-in-progress, a pull-request run would cancel a
# live main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes. This job runs in a few minutes; 20 is
    # generous and turns a hung run into a failure instead of a six-hour stall.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The whole suite, not just the browser half. A 2026-08-14 sweep found 29
      # repos whose deploy job ran the accessibility gate alone, so their unit
      # and algorithmic suites never blocked a publish -- they could ship a
      # build whose cryptography was broken so long as the browser specs passed.
      - name: Unit and correctness suite (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      # NEVER `--with-deps`. That apt step wedged 547 runs across this fleet;
      # the ubuntu-latest image already carries the shared libraries Chromium
      # needs.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y

      - name: Claims suite (does the page tell the truth)
        run: npm run test:claims

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # NOT `== 'push'`. That also skips workflow_dispatch, which is the one
    # trigger the auto-merge job below depends on: the dispatched run would
    # build, pass the gate, and skip this job, so the site would never update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  dependabot-auto-merge:
    # Every gate job. This is the whole safety argument: the gate decides, not
    # the version number. A major that breaks the lab fails the gate and the
    # pull request stays open for a human.
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required for the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge any bump whose gate went green
        run: |
          for attempt in 1 2 3; do
            gh pr merge --squash --delete-branch "$PR_URL" && merged=1 && break
            sleep 15          # a sibling PR merging first moves main under us
          done
          [ -n "$merged" ] || { echo "::warning::gate passed, merge did not land"; exit 0; }
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # Dispatch the file THIS lab has: most are deploy.yml, some deploy-pages.yml
          # or pages.yml. A copied name 404s only on the auto-merge path, after the
          # merge has landed. See §6.2.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
